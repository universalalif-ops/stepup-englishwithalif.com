<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn with Alif — Free English Fluency</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4ff;--tx:#10122b;--mu:#5a6086;--gl:rgba(255,255,255,.6);--bd:rgba(255,255,255,.85);--ac:#6c5cff;--ac2:#00b8f0;--ok:#16a34a;--no:#e11d48;--sh:0 12px 40px rgba(70,70,160,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070817;--tx:#eef0ff;--mu:#9ca2cc;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--sh:0 12px 40px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#070817;--tx:#eef0ff;--mu:#9ca2cc;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--sh:0 12px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;color:var(--tx);background:radial-gradient(700px 480px at 8% -5%,rgba(108,92,255,.38),transparent),radial-gradient(600px 460px at 100% 15%,rgba(0,184,240,.28),transparent),var(--bg);background-attachment:fixed;min-height:100vh;line-height:1.6}
#cg{position:fixed;top:0;left:0;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(108,92,255,.3),transparent 66%);pointer-events:none;z-index:0}
#cr{position:fixed;top:0;left:0;width:28px;height:28px;border:1.5px solid var(--ac);border-radius:50%;pointer-events:none;z-index:90}
@media(hover:none){#cg,#cr{display:none}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:100;display:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;backdrop-filter:blur(20px);background:var(--gl);border-bottom:1px solid var(--bd)}
header b{font-weight:800;font-size:1.1rem;flex:1}
header span{font-size:.85rem;color:var(--mu)}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 18px 80px}
.g{position:relative;overflow:hidden;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(22px) saturate(1.6);border-radius:26px;box-shadow:var(--sh)}
.g::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(108,92,255,.22),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.g:hover::before{opacity:1}
.p{padding:24px;margin:16px 0}
h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15;margin:.2em 0;letter-spacing:-.02em}
h2{margin:32px 4px 12px;font-size:1.3rem}h2 i{font-style:normal;color:var(--mu);font-weight:400;font-size:.95rem}
h3{margin:18px 0 8px}h4{margin:6px 0}
.mu,small{color:var(--mu)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.b2{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
.cta{width:100%;padding:16px;font-size:1.05rem;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{padding:18px;cursor:pointer;transition:transform .2s}.card:hover{transform:translateY(-3px)}
.card b{font-size:1.6rem;color:var(--ac)}.off{opacity:.55;cursor:default}.off:hover{transform:none}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:10px}.bar div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
.tip{background:rgba(108,92,255,.14);border-radius:16px;padding:12px 16px;margin-top:12px}
.chips span{display:inline-block;margin:4px;padding:6px 12px;border-radius:99px;background:var(--gl);border:1px solid var(--bd)}.chips i{color:var(--mu);font-style:normal}
.pat{padding:10px 14px;margin:6px 0;border-left:4px solid var(--ac);background:var(--gl);border-radius:0 12px 12px 0;font-weight:600}
.hid{display:none}#tr{margin-top:12px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--gl);color:var(--tx);border:1px solid var(--bd)}
.ok{border-color:var(--ok)!important;background:rgba(22,163,74,.2)!important}.no{border-color:var(--no)!important;background:rgba(225,29,72,.18)!important}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);margin:6px 0}
select{width:auto}
#md{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(5,5,20,.5)}
#md .g{max-width:420px;padding:32px;text-align:center;margin:20px}
.q{font-size:1.05rem;font-style:italic;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="cg"></div><div id="cr"></div><canvas id="cf"></canvas>
<header id="hd" class="hid"><b>Learn with Alif</b><span id="pg"></span><button class="b2" onclick="tg()" aria-label="Switch theme">◐</button><button class="b2" onclick="out()">Log out</button></header>
<main id="app"></main>
<div id="md"></div>
<script>
const $=s=>document.querySelector(s);
let S={d:{}},cur=null;
try{S=JSON.parse(localStorage.getItem("lwa"))||{d:{}}}catch(e){}
const save=()=>{try{localStorage.setItem("lwa",JSON.stringify(S))}catch(e){}};
const T="Basic English Sentence Formation|Essential Everyday Vocabulary|Essential Speaking Patterns|Basic Listening Development|Pronunciation & Shadowing Foundation|Everyday Conversation Practice|Practical Vocabulary Expansion|Practical Sentence Patterns|Real-Life Speaking Situations|Natural English Pronunciation|Listening Comprehension Development|Everyday Communication Mastery|Intermediate Vocabulary Mastery|Advanced Sentence Construction|Natural Conversation Skills|Storytelling & Personal Expression|Intermediate Listening Mastery|Thinking & Speaking in English|Advanced Vocabulary & Expressions|Advanced Speaking Techniques|Advanced Listening Skills|Professional Communication|Advanced Fluency Development|Advanced Language Development|Advanced Listening Mastery|Advanced Discussion & Debate|Advanced Speaking & Presentation|Natural English Mastery|Comprehensive Listening Examination|Comprehensive Speaking Examination|Complete Shadowing Mastery|English Pronunciation Science|English Thinking Development|Listening Beyond Words|Conversation Fluency Training|English Immersion Training".split("|");
const G=[["A1","Beginner",1,6],["A2","Elementary",7,12],["B1","Intermediate",13,18],["B2","Upper-Intermediate",19,23],["C1","Advanced",24,28],["Final","Exams",29,30],["Pro","Specialist Skills",31,36]];
const Q=["Consistency is the key.","Small steps every day beat big jumps once a month.","Don’t translate. Think, then speak.","Your voice is your superpower."];
const L={
1:[{t:"Say Who You Are",o:["Say your name, age and city","Use ready-made “I’m…” patterns"],e:"English speakers start with ready-made chunks. Learn the chunk, swap one word, and speak. There are no rules to memorise here — just listen, repeat and use.",bn:"‘আমি ঢাকায় থাকি’ = I live in Dhaka. Chunk-টা পুরো মুখস্থ করো, শুধু শব্দ বদলাও।",v:[["student","ছাত্র / ছাত্রী"],["live","বাস করা"],["from","থেকে"],["Nice to meet you","পরিচিত হয়ে ভালো লাগলো"]],p:["I’m ___.","My name is ___.","I live in ___.","I’m ___ years old."],d:[["Sara","Hi! I’m Sara. What’s your name?"],["Tom","Nice to meet you, Sara. My name is Tom."],["Sara","Where do you live, Tom?"],["Tom","I live in Dhaka. And you?"],["Sara","I live in Chattogram. I’m a student."]],q:[{q:"Where does Tom live?",o:["Chattogram","Dhaka","Sylhet"],a:1},{q:"What is Sara’s job?",o:["Teacher","Doctor","Student"],a:2}],s:"Say 4 sentences about yourself: name, city, age and one more fact. Record yourself and listen back.",m:"Don’t say “I am live in Dhaka.” Say “I live in Dhaka.”",h:"Say your introduction to a mirror 3 times today."},
{t:"Ask Simple Questions",o:["Ask someone’s name, city and feelings","Answer in short, natural replies"],e:"Questions are chunks too. Learn them whole, with the right melody: your voice goes up for yes/no questions and down for question words.",bn:"‘তুমি কেমন আছো?’ = How are you? ‘তুমি কোথা থেকে?’ = Where are you from?",v:[["from","থেকে"],["fine","ভালো"],["favourite","প্রিয়"],["too","-ও"]],p:["How are you?","Where are you from?","What do you do?","Do you like ___?"],d:[["Anna","Hi Raj! How are you?"],["Raj","I’m fine, thanks. And you?"],["Anna","Great! Where are you from?"],["Raj","I’m from Sylhet. Do you like tea?"],["Anna","Yes, I love tea! Sylhet has the best tea."]],q:[{q:"Where is Raj from?",o:["Dhaka","Sylhet","Khulna"],a:1},{q:"What does Anna love?",o:["Coffee","Tea","Juice"],a:1}],s:"Ask a friend (or a mirror) 4 questions, then answer them yourself out loud.",m:"Don’t say “Where you are from?” Say “Where are you from?”",h:"Ask 3 people one of today’s questions in English, or send yourself a voice message."}],
2:[{t:"Greetings All Day",o:["Greet people at any time of day","Reply naturally to “How’s it going?”"],e:"Real speakers use short, warm greetings. Match the greeting to the time of day and add a quick follow-up.",bn:"সকালে Good morning, বিকেলে Good afternoon, সন্ধ্যায় Good evening। Good night বলা হয় বিদায়ের সময়।",v:[["morning","সকাল"],["afternoon","দুপুর / বিকেল"],["evening","সন্ধ্যা"],["See you later","পরে দেখা হবে"]],p:["Good morning! How’s it going?","Not bad, thanks. You?","See you later!","Take care!"],d:[["Mia","Good morning, Sam! How’s it going?"],["Sam","Not bad, thanks. A bit sleepy. You?"],["Mia","I’m great! I had tea this morning."],["Sam","Nice! Well, I have to go. See you later!"],["Mia","See you! Take care!"]],q:[{q:"How does Sam feel?",o:["Sleepy","Angry","Hungry"],a:0},{q:"What does Sam say at the end?",o:["Good night","See you later","Come here"],a:1}],s:"Greet 3 imaginary people: one in the morning, one in the afternoon, one in the evening. Add a follow-up each time.",m:"Don’t use “Good night” as a greeting at 8 pm. It means goodbye.",h:"Greet your family in English tomorrow morning."}],
3:[{t:"Talk About Your Day",o:["Describe your routine in order","Link ideas with “then” and “after that”"],e:"Tell your day like a mini story: first, then, after that. The time words do the work for you.",bn:"‘আমি ছয়টায় উঠি’ = I wake up at six. তারপর = then। এরপর = after that।",v:[["wake up","ঘুম থেকে ওঠা"],["breakfast","সকালের নাস্তা"],["then","তারপর"],["after that","এরপর"]],p:["I wake up at ___.","Then I ___.","After that, I ___.","In the evening, I ___."],d:[["Ben","Mina, what’s your day like?"],["Mina","I wake up at six. Then I have breakfast."],["Mina","After that, I go to school by bus."],["Ben","And in the evening?"],["Mina","I study for two hours. Then I watch a movie."]],q:[{q:"When does Mina wake up?",o:["At six","At seven","At eight"],a:0},{q:"How does she go to school?",o:["By rickshaw","By bus","On foot"],a:1}],s:"Tell your day in 5 sentences with “then” and “after that”. Aim for 45 seconds without stopping.",m:"Don’t say “I am wake up.” Say “I wake up.”",h:"Each night, tell your day in English for one minute."}]};
const tot=Object.values(L).reduce((a,b)=>a+b.length,0);
const dn=()=>Object.keys(S.d).length;
function pg(){$("#pg").textContent=dn()+" / "+tot+" lessons done"}
function boot(){if(S.in){$("#hd").classList.remove("hid");home()}else login()}
function login(){$("#hd").classList.add("hid");$("#app").innerHTML=`<div class="g p" style="max-width:420px;margin:12vh auto"><h1>Learn with Alif</h1><p class="mu">ইংরেজি শিখো, একদম ফ্রিতে। Listen. Speak. Think in English.</p><input id="u" placeholder="Username" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()"><p id="er" style="color:var(--no);margin:4px 0"></p><button class="cta" onclick="go()">Log in</button></div>`}
function go(){if($("#u").value.trim().toLowerCase()==="alif"&&$("#pw").value==="learnwithalif"){S.in=1;save();boot()}else $("#er").textContent="Wrong username or password. Check both and try again."}
function out(){S.in=0;save();speechSynthesis.cancel();login()}
function home(){pg();const p=Math.round(dn()/tot*100);
$("#app").innerHTML=`<div class="g p"><h1>Welcome back, Alif 👋</h1><p class="q">“${Q[Math.floor(Math.random()*Q.length)]}”</p><p>আজ কোন lesson শুরু করবে? Pick a module and start with your ears, not your textbook.</p><div class="bar"><div style="width:${p}%"></div></div><small>${dn()} of ${tot} live lessons complete. The other modules are being filled in.</small></div>`+
G.map(([lv,nm,a,b])=>`<h2>${lv} <i>${nm}</i></h2><div class="grid">`+Array.from({length:b-a+1},(_,j)=>{const n=a+j,k=L[n],c=k?k.filter((_,i)=>S.d[n+"."+(i+1)]).length:0;return `<div class="g card ${k?"":"off"}" ${k?`onclick="mod(${n})"`:""}><b>${String(n).padStart(2,"0")}</b><h4>${T[n-1]}</h4><small>${k?c+" / "+k.length+" lessons done":"Coming soon"}</small></div>`}).join("")+`</div>`).join("")+
`<div class="g p"><h3>Final feedback</h3><p class="mu">What helped? What was confusing?</p><textarea id="fb" rows="3">${S.fb||""}</textarea><button onclick="fb()">Save feedback</button> <small id="fbm"></small></div>`}
function fb(){S.fb=$("#fb").value;save();$("#fbm").textContent="Saved on this device. Thank you!"}
function mod(n){speechSynthesis.cancel();$("#app").innerHTML=`<button class="b2" onclick="home()">← All modules</button><h1>Module ${n}: ${T[n-1]}</h1>`+L[n].map((l,i)=>`<div class="g card" onclick="les(${n},${i})"><h4>Lesson ${n}.${i+1} · ${l.t}</h4><small>${S.d[n+"."+(i+1)]?"✓ Completed":"Not started"}</small></div><div style="height:12px"></div>`).join("");scrollTo(0,0)}
function les(n,i){const l=L[n][i],id=n+"."+(i+1);cur={n,i,l,id};
$("#app").innerHTML=`<button class="b2" onclick="mod(${n})">← Module ${n}</button>
<div class="g p"><small>Lesson ${id}</small><h1>${l.t}</h1><h3>🎯 You will learn</h3><ul>${l.o.map(x=>`<li>${x}</li>`).join("")}</ul><p>${l.e}</p><div class="tip">🇧🇩 ${l.bn}</div></div>
<div class="g p"><h3>📚 Words in context</h3><div class="chips">${l.v.map(v=>`<span>${v[0]} <i>${v[1]}</i></span>`).join("")}</div><h3>🧩 Patterns to use</h3>${l.p.map(x=>`<div class="pat">${x}</div>`).join("")}</div>
<div class="g p"><h3>🎧 Listen first</h3><p class="mu">Voices are computer text-to-speech, not human recordings. Listen once without reading.</p><div class="row"><button onclick="say(cur.l.d,.65)">▶ Slow</button><button onclick="say(cur.l.d,.95)">▶ Normal</button><button class="b2" onclick="speechSynthesis.cancel()">■ Stop</button><button class="b2" onclick="$('#tr').classList.toggle('hid')">Show / hide transcript</button></div><div id="tr" class="hid">${l.d.map(x=>`<p><b>${x[0]}:</b> ${x[1]}</p>`).join("")}</div></div>
<div class="g p"><h3>🗣️ Shadowing</h3><p class="mu">Play a line, then say it together with the voice. Copy the rhythm and the melody.</p><div class="row">Speed <select id="sp"><option value=".65">Slow</option><option value=".95" selected>Normal</option><option value="1.2">Fast</option></select></div>${l.d.map((x,k)=>`<div class="row" style="margin:8px 0"><button class="b2" onclick="say([cur.l.d[${k}]],+$('#sp').value)">▶</button><span>${x[1]}</span></div>`).join("")}</div>
<div class="g p"><h3>✅ Listening check</h3>${l.q.map((q,qi)=>`<p><b>${q.q}</b></p>`+q.o.map((o,oi)=>`<button class="opt" onclick="pick(this,${q.a},${oi})">${o}</button>`).join("")).join("")}</div>
<div class="g p"><h3>🎤 Speaking challenge</h3><p>${l.s}</p><div class="row"><button onclick="tm(this)">Start 60 s timer</button><button class="b2" onclick="rec(this)">● Record</button></div><audio id="pb" controls hidden></audio><p class="mu">Recording is for self-checking. Nothing here scores your pronunciation.</p></div>
<div class="g p"><h3>⚠️ Common mistake</h3><p>${l.m}</p><h3>📝 Homework</h3><p>${l.h}</p><button class="cta" onclick="fin()">${S.d[id]?"Completed ✓ — mark again":"Complete lesson"}</button></div>`;scrollTo(0,0)}
function pick(b,a,i){[...b.parentNode.querySelectorAll(".opt")].forEach(x=>x.disabled=true);b.classList.add(i===a?"ok":"no");if(i!==a){const c=b.parentNode.querySelectorAll(".opt");}}
let vs=[];const lv=()=>{vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))};
try{lv();speechSynthesis.onvoiceschanged=lv}catch(e){}
function say(ls,r){try{speechSynthesis.cancel()}catch(e){return}const sp={};let i=0;(function nx(){if(i>=ls.length)return;const[s,t]=ls[i++];if(!(s in sp))sp[s]=Object.keys(sp).length;const k=sp[s],u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(vs.length)u.voice=vs[k%vs.length];u.pitch=k?.8:1.15;u.rate=r;u.onend=nx;speechSynthesis.speak(u)})()}
let tI,mr,ch=[];
function tm(b){clearInterval(tI);let n=60;b.textContent=n+" s";tI=setInterval(()=>{n--;b.textContent=n>0?n+" s":"Time’s up!";if(n<=0)clearInterval(tI)},1e3)}
async function rec(b){try{if(mr&&mr.state==="recording"){mr.stop();b.textContent="● Record";return}const st=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(st);ch=[];mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const a=$("#pb");a.src=URL.createObjectURL(new Blob(ch));a.hidden=false;a.play()};mr.start();b.textContent="■ Stop"}catch(e){alert("The microphone isn’t available here. Say your answer out loud and judge it yourself.")}}
function fin(){S.d[cur.id]=1;save();pg();boom();const n=cur.n;$("#md").style.display="grid";$("#md").innerHTML=`<div class="g"><h1>🎉 Congratulations!</h1><p>You finished Lesson ${cur.id}: ${cur.l.t}.</p><p class="q">“Consistency is the key.”</p><button class="cta" onclick="$('#md').style.display='none';mod(${n})">Continue</button></div>`}
function boom(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;c.style.display="block";const P=Array.from({length:170},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*17,vy:Math.random()*-15-4,r:Math.random()*6+3,c:`hsl(${Math.random()*360},90%,60%)`,a:Math.random()*6}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<170)requestAnimationFrame(d);else c.style.display="none"})()}
function tg(){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark"}
let mx=0,my=0,rx=0,ry=0;const cg=$("#cg"),cr=$("#cr");
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;cg.style.transform=`translate(${mx-210}px,${my-210}px)`;const t=e.target.closest&&e.target.closest(".g");if(t){const r=t.getBoundingClientRect();t.style.setProperty("--mx",e.clientX-r.left+"px");t.style.setProperty("--my",e.clientY-r.top+"px")}});
(function l(){rx+=(mx-rx)*.15;ry+=(my-ry)*.15;cr.style.transform=`translate(${rx-14}px,${ry-14}px)`;requestAnimationFrame(l)})();
boot();
</script>
</body>
</html>
